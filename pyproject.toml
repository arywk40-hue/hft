[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebx-quant-analysis"
version = "0.1.0"
description = "Reproducible EBX quantitative research and validation artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "pyarrow>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ebx = "ebx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ebx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
addopts = "-ra"
